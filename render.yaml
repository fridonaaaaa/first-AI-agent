services:
  - type: web
    name: ai-investigation-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this in Render dashboard — your Supabase URL
      - key: ADMIN_TOKEN
        sync: false          # Set this in Render dashboard — any secret string
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false          # Set this in Render dashboard — your Gemini API key
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: EMBEDDING_DIM
        value: "384"
      - key: RETRIEVAL_MODE
        value: hybrid_rerank
      - key: RETRIEVAL_TOP_K
        value: "10"
      - key: BM25_K1
        value: "1.5"
      - key: BM25_B
        value: "0.75"
      - key: RRF_K
        value: "60"
      - key: MAX_TOOL_STEPS
        value: "8"
      - key: MAX_SUB_QUERIES
        value: "4"
      - key: ABSTENTION_THRESHOLD
        value: "0.010"
      - key: RATE_LIMIT_PER_IP_PER_MINUTE
        value: "20"
      - key: DAILY_CAP_ASK
        value: "1000"
      - key: LLM_CACHE_DIR
        value: /tmp/llm_cache
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /home/appuser/.cache/st
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
