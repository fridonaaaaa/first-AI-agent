<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI საგამოძიებო სისტემა</title>
  <script src="/i18n.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }
    header {
      background: #16213e;
      color: #e0e0e0;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p  { font-size: 0.85rem; opacity: 0.7; margin-top: 0.2rem; }
    nav a {
      color: #90caf9;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
    }
    nav a:hover { text-decoration: underline; }

    main { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }

    /* ── Ask panel ── */
    #ask-panel { background: #fff; border-radius: 12px; padding: 1.8rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
    textarea {
      width: 100%; min-height: 90px; padding: 0.8rem;
      border: 1.5px solid #cdd; border-radius: 8px;
      font-size: 1rem; resize: vertical;
    }
    textarea:focus { outline: none; border-color: #5c6bc0; }
    button.primary {
      margin-top: 0.8rem; padding: 0.7rem 2rem;
      background: #3f51b5; color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
      transition: background .2s;
    }
    button.primary:hover { background: #303f9f; }
    button.primary:disabled { background: #9e9e9e; cursor: default; }

    /* ── Answer ── */
    #answer-section { display: none; margin-top: 1.5rem; }
    #answer-box {
      background: #e8f5e9; border-left: 4px solid #43a047;
      border-radius: 8px; padding: 1.2rem; white-space: pre-wrap;
      font-size: 1rem; line-height: 1.6;
    }
    #answer-box.abstained { background: #fff8e1; border-color: #ffa000; }
    .meta { font-size: 0.8rem; color: #666; margin-top: 0.5rem; }

    /* ── Sub-queries ── */
    #subq-section { margin-top: 1.2rem; }
    .section-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.5rem; color: #3f51b5; }
    .tag {
      display: inline-block; background: #e3f2fd; color: #1565c0;
      border-radius: 20px; padding: 0.2rem 0.7rem;
      font-size: 0.82rem; margin: 0.2rem 0.2rem 0.2rem 0;
    }

    /* ── Sources ── */
    #sources-section { margin-top: 1.2rem; }
    .source-card {
      background: #fafafa; border: 1px solid #e0e0e0;
      border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.6rem;
    }
    .source-id { font-size: 0.75rem; font-family: monospace; color: #555; }
    .source-text { font-size: 0.9rem; margin-top: 0.3rem; color: #333; }
    .score-badge {
      display: inline-block; background: #e8eaf6; color: #3f51b5;
      border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.75rem; float: right;
    }

    /* ── Conflicts ── */
    #conflicts-section { margin-top: 1.2rem; }
    .conflict-card {
      background: #fff3e0; border: 1px solid #ffb74d;
      border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.6rem;
    }
    .conflict-card.agree { background: #e8f5e9; border-color: #81c784; }
    .verdict-badge {
      display: inline-block; border-radius: 4px; padding: 0.1rem 0.5rem;
      font-size: 0.75rem; font-weight: 700;
    }
    .verdict-conflict { background: #ffccbc; color: #bf360c; }
    .verdict-agree    { background: #c8e6c9; color: #1b5e20; }

    /* ── Admin panel ── */
    #admin-panel {
      display: none; background: #fff;
      border-radius: 12px; padding: 1.8rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-top: 1rem;
    }
    #admin-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #333; }
    .form-row { margin-bottom: 0.8rem; }
    input[type=text], input[type=password] {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1.5px solid #cdd; border-radius: 6px; font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #5c6bc0; }
    #admin-msg { margin-top: 0.6rem; font-size: 0.9rem; }
    .ok  { color: #2e7d32; }
    .err { color: #c62828; }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 3px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <h1 id="app-title"></h1>
    <p id="app-subtitle"></p>
  </div>
  <nav>
    <a href="#" id="nav-ask" onclick="showPanel('ask')"></a>
    <a href="#" id="nav-admin" onclick="showPanel('admin')"></a>
  </nav>
</header>

<main>

  <!-- Ask panel -->
  <div id="ask-panel">
    <label id="question-label" for="question"></label>
    <textarea id="question" rows="3"></textarea>
    <br/>
    <button class="primary" id="submit-btn" onclick="submitQuestion()"></button>

    <div id="answer-section">
      <div id="answer-box"></div>
      <div class="meta" id="answer-meta"></div>

      <div id="subq-section">
        <div class="section-title" id="subq-title"></div>
        <div id="subq-tags"></div>
      </div>

      <div id="conflicts-section" style="display:none">
        <div class="section-title" id="conflicts-title"></div>
        <div id="conflicts-list"></div>
      </div>

      <div id="sources-section">
        <div class="section-title" id="sources-title"></div>
        <div id="sources-list"></div>
      </div>
    </div>
  </div>

  <!-- Admin panel -->
  <div id="admin-panel">
    <h2 id="admin-title"></h2>
    <div class="form-row">
      <label id="token-label" for="admin-token"></label>
      <input type="password" id="admin-token" autocomplete="current-password" />
    </div>
    <div class="form-row">
      <label id="doc-title-label" for="doc-title"></label>
      <input type="text" id="doc-title" />
    </div>
    <div class="form-row">
      <label id="doc-source-label" for="doc-source"></label>
      <input type="text" id="doc-source" placeholder="https://..." />
    </div>
    <div class="form-row">
      <label id="doc-text-label" for="doc-text"></label>
      <textarea id="doc-text" rows="5"></textarea>
    </div>
    <button class="primary" id="upload-btn" onclick="uploadDocument()"></button>
    <div id="admin-msg"></div>
  </div>

</main>

<script>
// ── i18n wiring ──────────────────────────────────────────────────────────────
function t(key) { return I18N[key] || key; }

function applyI18n() {
  document.title                              = t("appTitle");
  document.getElementById("app-title").textContent    = t("appTitle");
  document.getElementById("app-subtitle").textContent = t("appSubtitle");
  document.getElementById("nav-ask").textContent      = t("appTitle").split(" ")[0];
  document.getElementById("nav-admin").textContent    = t("adminTitle");
  document.getElementById("question-label").textContent = t("questionLabel");
  document.getElementById("question").placeholder      = t("questionPlaceholder");
  document.getElementById("submit-btn").textContent    = t("submitButton");
  document.getElementById("subq-title").textContent    = t("subQueriesTitle");
  document.getElementById("sources-title").textContent = t("sourcesTitle");
  document.getElementById("conflicts-title").textContent = t("conflictsTitle");
  document.getElementById("admin-title").textContent   = t("adminTitle");
  document.getElementById("token-label").textContent   = t("tokenLabel");
  document.getElementById("doc-title-label").textContent = t("docTitleLabel");
  document.getElementById("doc-source-label").textContent = t("docSourceLabel");
  document.getElementById("doc-text-label").textContent = t("docTextLabel");
  document.getElementById("upload-btn").textContent    = t("uploadButton");
}

// ── Panel navigation ─────────────────────────────────────────────────────────
function showPanel(name) {
  document.getElementById("ask-panel").style.display   = name === "ask"   ? "" : "none";
  document.getElementById("admin-panel").style.display = name === "admin" ? "" : "none";
}

// ── Ask ───────────────────────────────────────────────────────────────────────
async function submitQuestion() {
  const q = document.getElementById("question").value.trim();
  if (!q) return;

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${t("searching")}`;

  document.getElementById("answer-section").style.display = "none";

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.detail || data.error || t("errorMsg"));
      return;
    }
    renderAnswer(data);
  } catch (e) {
    showError(t("errorMsg"));
  } finally {
    btn.disabled = false;
    btn.textContent = t("submitButton");
  }
}

function showError(msg) {
  const box = document.getElementById("answer-box");
  box.className = "abstained";
  box.textContent = msg;
  document.getElementById("answer-meta").textContent = "";
  document.getElementById("answer-section").style.display = "";
}

function renderAnswer(data) {
  // Answer
  const box = document.getElementById("answer-box");
  box.textContent = data.answer;
  box.className = data.abstained ? "abstained" : "";

  // Meta
  const lang = data.language === "georgian" ? t("langGeorgian") : t("langEnglish");
  document.getElementById("answer-meta").textContent =
    `${lang} · ${t("stepsLabel")}: ${data.steps_used}`;

  // Sub-queries
  const tags = document.getElementById("subq-tags");
  tags.innerHTML = "";
  (data.sub_queries || []).forEach(sq => {
    const el = document.createElement("span");
    el.className = "tag";
    el.textContent = sq;
    tags.appendChild(el);
  });

  // Conflicts
  const confSec = document.getElementById("conflicts-section");
  const confList = document.getElementById("conflicts-list");
  confList.innerHTML = "";
  const realConflicts = (data.conflicts || []).filter(c => c.verdict !== "unrelated");
  if (realConflicts.length > 0) {
    confSec.style.display = "";
    realConflicts.forEach(c => {
      const card = document.createElement("div");
      card.className = "conflict-card" + (c.verdict === "agree" ? " agree" : "");
      const badge = `<span class="verdict-badge verdict-${c.verdict}">${c.verdict === "conflict" ? t("conflictBadge") : t("agreeBadge")}</span>`;
      card.innerHTML = `${badge} <b>[${c.chunk_a}]</b> vs <b>[${c.chunk_b}]</b><br/><small>${escHtml(c.reason)}</small>`;
      confList.appendChild(card);
    });
  } else {
    confSec.style.display = "none";
  }

  // Sources
  const srcList = document.getElementById("sources-list");
  srcList.innerHTML = "";
  if (!data.sources || data.sources.length === 0) {
    srcList.textContent = t("noSources");
  } else {
    data.sources.forEach(s => {
      const card = document.createElement("div");
      card.className = "source-card";
      card.innerHTML =
        `<span class="score-badge">${t("scoreLabel")}: ${s.rrf_score.toFixed(4)}</span>` +
        `<div class="source-id">${t("chunkIdLabel")}: ${escHtml(s.chunk_id)}</div>` +
        `<div class="source-text">${escHtml(s.text.slice(0, 300))}${s.text.length > 300 ? "…" : ""}</div>`;
      srcList.appendChild(card);
    });
  }

  document.getElementById("answer-section").style.display = "";
}

// ── Admin upload ──────────────────────────────────────────────────────────────
async function uploadDocument() {
  const token  = document.getElementById("admin-token").value.trim();
  const title  = document.getElementById("doc-title").value.trim();
  const text   = document.getElementById("doc-text").value.trim();
  const source = document.getElementById("doc-source").value.trim();
  const msg    = document.getElementById("admin-msg");

  if (!token || !title || !text) {
    msg.className = "err";
    msg.textContent = "Token, title and text are required.";
    return;
  }

  try {
    const res = await fetch("/documents", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Admin-Token": token,
      },
      body: JSON.stringify({ title, text, source, format: "text", language: "en",
                             chunking_strategy: "sentence_window" }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.className = "err";
      msg.textContent = data.detail || "Upload failed.";
    } else {
      msg.className = "ok";
      msg.textContent = `${t("uploadSuccess")} ID: ${data.doc_id} · chunks: ${data.chunk_count}`;
      document.getElementById("doc-title").value = "";
      document.getElementById("doc-text").value  = "";
      document.getElementById("doc-source").value = "";
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = t("errorMsg");
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Enter key submits
document.addEventListener("DOMContentLoaded", () => {
  applyI18n();
  showPanel("ask");
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
  });
});
</script>
</body>
</html>
