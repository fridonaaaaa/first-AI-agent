<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI საგამოძიებო სისტემა</title>
  <script src="/i18n.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:        #2563EB;
      --blue-h:      #1d4ed8;
      --blue-light:  #EEF2FF;
      --blue-mid:    #DBEAFE;
      --sidebar-w:   272px;
      --bg:          #ffffff;
      --sidebar-bg:  #F0F4FF;
      --border:      #E2E8F0;
      --text:        #1E293B;
      --muted:       #64748B;
      --user-bg:     #2563EB;
      --ai-bg:       #F1F5F9;
      --radius:      14px;
      --footer-pad:  0.85rem; /* sidebar footer vertical padding — input bar matches this */
    }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 1.25rem 1rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .sidebar-logo {
      width: 38px; height: 38px;
      background: var(--blue);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-header h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .new-chat-btn {
      margin: 0 0.75rem 0.5rem;
      padding: 0.65rem 1rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background .15s;
    }
    .new-chat-btn:hover { background: var(--blue-h); }

    .history-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.75rem 1rem 0.3rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.25rem 0.5rem 0.5rem;
    }
    .history-item {
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background .1s;
      border-left: 3px solid transparent;
    }
    .history-item:hover { background: rgba(37,99,235,.07); }
    .history-item.active {
      background: var(--blue-light);
      color: var(--blue);
      border-left-color: var(--blue);
      font-weight: 600;
    }
    .history-item svg { flex-shrink: 0; opacity: 0.6; }
    .history-item.active svg { opacity: 1; }

    .sidebar-footer {
      padding: var(--footer-pad) 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .online-dot {
      width: 9px; height: 9px;
      background: #22c55e;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .online-label { font-size: 0.82rem; color: var(--muted); }

    /* ── Uploaded files in sidebar ── */
    .sidebar-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 0.6rem 1rem 0.2rem;
    }
    .file-item {
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background .1s;
      margin: 0 0.25rem;
    }
    .file-item:hover { background: rgba(37,99,235,.07); }
    .file-item.active { background: var(--blue-light); color: var(--blue); font-weight: 600; }
    .file-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-del {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.78rem; line-height: 1;
      padding: 0 0 0 0.3rem; flex-shrink: 0; opacity: 0.5;
      transition: opacity .1s, color .1s;
    }
    .file-del:hover { opacity: 1; color: #ef4444; }
    .file-del-spinner {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid rgba(100,116,139,.3);
      border-top-color: var(--muted);
      animation: spin .7s linear infinite;
      display: inline-block;
    }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: #fff;
    }

    /* ── Chat header ── */
    #chat-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 62px;
    }
    #chat-header-info h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    #chat-header-info p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1px;
    }
    #delete-chat-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 0.4rem;
      border-radius: 6px;
      transition: background .1s, color .1s;
      display: flex;
      align-items: center;
    }
    #delete-chat-btn:hover { background: #FEE2E2; color: #ef4444; }

    /* ── Body wrap: holds chat-area + input-bar ── */
    #body-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Chat messages ── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Empty state: center welcome+input as one group ── */
    #main.is-empty #body-wrap {
      justify-content: center;
    }
    #main.is-empty #chat-area {
      flex: 0 0 auto;
      overflow: visible;
      padding-bottom: 0;
    }

    /* Welcome screen */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 2rem 1.5rem;
      color: var(--muted);
    }
    #welcome .logo {
      width: 60px; height: 60px;
      background: var(--blue);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    #welcome h2 { font-size: 1.3rem; color: var(--text); margin-bottom: 0.4rem; }
    #welcome p  { font-size: 0.9rem; max-width: 360px; }

    /* Message bubbles */
    .message-row {
      display: flex;
      gap: 0.75rem;
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      align-items: flex-end;
    }
    .message-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .avatar.user-av { background: #CBD5E1; }
    .avatar.ai-av   { background: var(--blue); }

    .bubble {
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius);
      font-size: 0.93rem;
      line-height: 1.65;
      max-width: calc(100% - 52px);
    }
    .bubble.user-bubble {
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.ai-bubble {
      background: var(--ai-bg);
      border-bottom-left-radius: 4px;
    }
    .bubble.ai-bubble.abstained { background: #FFFBEB; }
    .bubble.ai-bubble.error     { background: #FFF1F2; }

    .answer-text { white-space: pre-wrap; }

    .msg-time {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.3rem;
      padding: 0 0.25rem;
    }
    .message-row.user .msg-time { text-align: right; }

    .msg-wrapper { display: flex; flex-direction: column; max-width: calc(100% - 52px); }
    .message-row.user .msg-wrapper { align-items: flex-end; }

    /* Details inside AI bubble */
    details {
      margin-top: 0.65rem;
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
    }
    summary {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    summary:hover { color: var(--blue); }

    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
    .tag {
      background: var(--blue-mid);
      color: var(--blue);
      border-radius: 20px;
      padding: 0.15rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .source-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      margin-top: 0.4rem;
      font-size: 0.82rem;
    }
    .source-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .source-text { color: #374151; line-height: 1.5; }

    .conflict-card {
      background: #fff8f0;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      margin-top: 0.4rem;
      font-size: 0.82rem;
    }
    .conflict-card.agree { background: #f0fdf4; border-color: #86efac; }
    .verdict-pill {
      display: inline-block;
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.71rem;
      font-weight: 700;
      margin-right: 0.3rem;
    }
    .verdict-conflict { background: #fee2e2; color: #991b1b; }
    .verdict-agree    { background: #dcfce7; color: #166534; }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .typing-indicator span {
      width: 8px; height: 8px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce .9s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .15s; }
    .typing-indicator span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    #input-bar {
      flex-shrink: 0;
      padding: 0.5rem 1.25rem var(--footer-pad);
      background: #fff;
    }
    #file-filter-chip {
      display: none;
      max-width: 768px;
      margin: 0 auto 0.4rem;
      padding: 0.3rem 0.65rem;
      background: var(--blue-light);
      color: var(--blue);
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      align-items: center;
      gap: 0.4rem;
      width: fit-content;
    }
    #file-filter-chip.visible { display: flex; }
    #file-filter-chip button {
      background: none; border: none; cursor: pointer;
      color: var(--blue); font-size: 0.9rem; line-height: 1; padding: 0;
    }
    .input-wrap {
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      transition: border-color .15s;
    }
    .input-wrap:focus-within { border-color: var(--blue); }
    #attach-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color .1s;
    }
    #attach-btn:hover { color: var(--blue); }
    #question {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.93rem;
      font-family: inherit;
      resize: none;
      background: transparent;
      max-height: 160px;
      min-height: 22px;
      line-height: 1.45;
      padding: 1px 0;
      color: var(--text);
    }
    #question::placeholder { color: #94A3B8; }
    #send-btn {
      width: 36px; height: 36px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--blue-h); }
    #send-btn:disabled { background: #CBD5E1; cursor: not-allowed; }
    #send-btn svg { pointer-events: none; }

    /* ── Admin overlay ── */
    #admin-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #admin-overlay.open { display: flex; }
    #admin-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 1.6rem;
      width: 460px;
      max-width: 95vw;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
    }
    .admin-header h2 { font-size: 1rem; font-weight: 700; }
    .close-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.2rem; line-height: 1;
    }
    .form-row { margin-bottom: 0.75rem; }
    .form-label {
      display: block;
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin-bottom: 0.3rem;
    }
    input[type=text], input[type=password], #admin-box textarea {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color .15s;
    }
    input:focus, #admin-box textarea:focus { outline: none; border-color: var(--blue); }
    .upload-btn {
      padding: 0.6rem 1.4rem;
      background: var(--blue); color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .upload-btn:hover { background: var(--blue-h); }
    .upload-btn:disabled { background: #CBD5E1; cursor: not-allowed; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-icon {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    #admin-msg { margin-top: 0.6rem; font-size: 0.85rem; font-weight: 500; }
    #admin-msg.ok  { color: #16a34a; }
    #admin-msg.err { color: #dc2626; }

    .admin-tabs { display: flex; gap: 0.4rem; margin: 0.75rem 0 0.9rem; }
    .admin-tab {
      flex: 1; padding: 0.45rem; border-radius: 6px;
      border: 1.5px solid var(--border); background: none;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      color: var(--muted); transition: all .15s;
    }
    .admin-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .drop-zone {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 1.5rem; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--blue); background: var(--blue-light);
    }
    .drop-zone p { font-size: 0.82rem; color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/>
        <path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="12" y1="16" x2="12" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
      </svg>
    </div>
    <h1 id="app-title"></h1>
  </div>

  <button class="new-chat-btn" onclick="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    ახალი საუბარი
  </button>

  <div class="history-label">ჩეთის ისტორია</div>
  <div id="history-list"></div>

  <!-- Uploaded files section -->
  <div id="files-section" style="display:none">
    <div class="sidebar-section-label">ჩემი ფაილები</div>
    <div id="files-list"></div>
  </div>

  <div class="sidebar-footer">
    <div class="online-dot"></div>
    <span class="online-label">Online</span>
  </div>
</div>

<!-- Main chat -->
<div id="main" class="is-empty">
  <div id="chat-header">
    <div id="chat-header-info">
      <h2 id="chat-header-title">ახალი საუბარი</h2>
      <p id="chat-header-sub"></p>
    </div>
    <button id="delete-chat-btn" onclick="deleteCurrentChat()" title="საუბრის წაშლა">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </button>
  </div>

  <div id="body-wrap">
    <div id="chat-area">
      <div id="welcome">
        <div class="logo">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <h2 id="welcome-title"></h2>
        <p id="welcome-sub"></p>
      </div>
    </div>

    <div id="input-bar">
      <div id="file-filter-chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        <span id="file-filter-name"></span>
        <button onclick="clearFileFilter()" title="ფილტრის გაუქმება">✕</button>
      </div>
      <div class="input-wrap">
        <button id="attach-btn" onclick="openAdmin()" title="ფაილის მიმაგრება">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea id="question" rows="1" placeholder="დასვით კითხვა..."></textarea>
        <button id="send-btn" onclick="submitQuestion()" title="გაგზავნა">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Admin modal -->
<div id="admin-overlay" onclick="closeAdminIfOutside(event)">
  <div id="admin-box">
    <div class="admin-header">
      <h2 id="admin-title"></h2>
      <button class="close-btn" onclick="closeAdmin()">✕</button>
    </div>
    <div class="form-row">
      <label class="form-label" id="token-label"></label>
      <input type="password" id="admin-token" autocomplete="current-password" />
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('file')">ფაილის ატვირთვა</button>
      <button class="admin-tab" onclick="switchTab('text')">ტექსტის ჩასმა</button>
    </div>
    <div id="tab-file">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p id="drop-label">PDF, DOCX, TXT, MD, HTML — max 50 MB</p>
        <p id="drop-filename" style="color:var(--blue);font-weight:600;margin-top:.3rem"></p>
      </div>
      <input type="file" id="file-input" accept=".pdf,.txt,.md,.html,.htm,.jsonl" style="display:none" onchange="onFileSelected(this)" />
      <button class="upload-btn" style="margin-top:.75rem" onclick="uploadFile()" id="file-upload-btn">ატვირთვა</button>
    </div>
    <div id="tab-text" style="display:none">
      <div class="form-row">
        <label class="form-label" id="doc-title-label"></label>
        <input type="text" id="doc-title" />
      </div>
      <div class="form-row">
        <label class="form-label" id="doc-source-label"></label>
        <input type="text" id="doc-source" placeholder="https://..." />
      </div>
      <div class="form-row">
        <label class="form-label" id="doc-text-label"></label>
        <textarea id="doc-text" rows="5"></textarea>
      </div>
      <button class="upload-btn" onclick="uploadDocument()" id="upload-btn"></button>
    </div>
    <div id="admin-msg"></div>
  </div>
</div>

<script>
function t(k) { return I18N[k] || k; }
function httpErr(status) { return I18N["err" + status] || t("errorMsg"); }

function applyI18n() {
  document.title                                           = t("appTitle");
  document.getElementById("app-title").textContent        = "AI Assistant";
  document.getElementById("question").placeholder         = "დასვით კითხვა...";
  document.getElementById("welcome-title").textContent    = t("appTitle");
  document.getElementById("welcome-sub").textContent      = t("questionPlaceholder");
  document.getElementById("admin-title").textContent      = t("uploadTitle");
  document.getElementById("token-label").textContent      = t("tokenLabel");
  document.getElementById("doc-title-label").textContent  = t("docTitleLabel");
  document.getElementById("doc-source-label").textContent = t("docSourceLabel");
  document.getElementById("doc-text-label").textContent   = t("docTextLabel");
  document.getElementById("upload-btn").textContent       = t("uploadButton");
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function uuidv4() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
  );
}

function _nowTime() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// ── Session state ────────────────────────────────────────────────────────────
let _sessions = [];
let _currentId = null;
let _lastToken = "";

const _LS_SESSIONS      = "ai_sessions_v2";
const _LS_TOKEN         = "ai_token";
const _LS_DEPLOY_VER    = "ai_deploy_ver";
const _DEPLOY_VERSION   = "2026-10-29-3";

function _currentSession() {
  return _sessions.find(s => s.id === _currentId) || null;
}

function _saveSessions() {
  const slim = _sessions.map(s => ({ ...s, messages: s.messages.slice(-20) }));
  try {
    localStorage.setItem(_LS_SESSIONS, JSON.stringify(slim));
    if (_lastToken) localStorage.setItem(_LS_TOKEN, _lastToken);
  } catch {}
}

function _loadSessions() {
  // Wipe chat history when a new version is deployed
  if (localStorage.getItem(_LS_DEPLOY_VER) !== _DEPLOY_VERSION) {
    localStorage.removeItem(_LS_SESSIONS);
    localStorage.removeItem(_LS_TOKEN);
    localStorage.setItem(_LS_DEPLOY_VER, _DEPLOY_VERSION);
    _sessions = [];
    _createSession();
    return;
  }
  try {
    const raw = localStorage.getItem(_LS_SESSIONS);
    if (raw) _sessions = JSON.parse(raw);
    _lastToken = localStorage.getItem(_LS_TOKEN) || "";
  } catch { _sessions = []; }
  // Restore last session; only create a fresh one if there are none
  if (_sessions.length === 0) {
    _createSession();
  } else {
    _currentId = _sessions[0].id;
  }
}

function _createSession() {
  const s = {
    id: uuidv4(),
    label: "ახალი საუბარი",
    messages: [],
    files: [],
    activeDocId: null,
  };
  _sessions.unshift(s);
  _currentId = s.id;
  _saveSessions();
  return s;
}

// ── Header rendering ──────────────────────────────────────────────────────────
function renderHeader() {
  const s = _currentSession();
  const title = document.getElementById("chat-header-title");
  const sub   = document.getElementById("chat-header-sub");
  if (s) {
    title.textContent = s.label;
    const count = s.messages.length;
    sub.textContent = count ? `${count} შეტყობინება` : "";
  }
}

// ── Chat rendering ────────────────────────────────────────────────────────────
function _userRowHTML(text, time) {
  return `<div class="message-row user">
    <div class="avatar user-av">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div class="msg-wrapper">
      <div class="bubble user-bubble">${escHtml(text)}</div>
      <div class="msg-time">${time || ""}</div>
    </div>
  </div>`;
}

function _aiBubbleHTML(data, time) {
  const cls = data._error ? "error" : data.abstained ? "abstained" : "";
  const cleanAnswer = data.answer.replace(/\s*\[[^\]]*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[^\]]*\]/gi, '');
  let inner = `<div class="answer-text">${escHtml(cleanAnswer)}</div>`;
  if (!data._error) {
    const sources = data.sources || [];
    if (sources.length > 0) {
      inner += `<details><summary>${t("sourcesTitle")} (${sources.length})</summary>${
        sources.map(s => {
          const docName = s.title ? escHtml(s.title) : `<span style="font-family:monospace;font-size:.71rem;color:var(--muted)">${escHtml(s.chunk_id.slice(0,8))}</span>`;
          return `<div class="source-card">
            <div class="source-header"><span style="font-weight:600;font-size:.82rem">${docName}</span></div>
            <div class="source-text">${escHtml(s.text.slice(0,280))}${s.text.length>280?"…":""}</div>
          </div>`;
        }).join("")
      }</details>`;
    }
    const conflicts = (data.conflicts || []).filter(c => c.verdict === "conflict");
    if (conflicts.length) {
      inner += `<details><summary>${t("conflictsTitle")} (${conflicts.length})</summary>${
        conflicts.map(c => `<div class="conflict-card">
          <span class="verdict-pill verdict-conflict">${t("conflictBadge")}</span>${escHtml(c.reason)}
        </div>`).join("")
      }</details>`;
    }
    const subs = data.sub_queries || [];
    if (subs.length > 1) {
      inner += `<details><summary>${t("subQueriesTitle")}</summary>
        <div class="tags">${subs.map(q => `<span class="tag">${escHtml(q)}</span>`).join("")}</div>
      </details>`;
    }
  }
  return `<div class="message-row">
    <div class="avatar ai-av">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/>
        <path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="12" y1="16" x2="12" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
      </svg>
    </div>
    <div class="msg-wrapper">
      <div class="bubble ai-bubble ${cls}">${inner}</div>
      <div class="msg-time">${time || ""}</div>
    </div>
  </div>`;
}

function renderChat() {
  const s = _currentSession();
  const chat = document.getElementById("chat-area");
  const main = document.getElementById("main");
  if (!s || s.messages.length === 0) {
    main.classList.add("is-empty");
    chat.innerHTML = `<div id="welcome">
      <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <h2 id="welcome-title">${t("appTitle")}</h2>
      <p>${t("questionPlaceholder")}</p>
    </div>`;
    return;
  }
  main.classList.remove("is-empty");
  chat.innerHTML = "";
  for (const m of s.messages) {
    const div = document.createElement("div");
    if (m.role === "user") div.innerHTML = _userRowHTML(m.text, m.time);
    else                   div.innerHTML = _aiBubbleHTML(m.data, m.time);
    chat.appendChild(div.firstElementChild);
  }
  chat.scrollTop = chat.scrollHeight;
}

function deleteSession(id) {
  _sessions = _sessions.filter(s => s.id !== id);
  if (_currentId === id) {
    _currentId = _sessions.length ? _sessions[0].id : null;
    if (!_currentId) _createSession();
  }
  _saveSessions();
  renderHistory();
  renderChat();
  renderHeader();
}

function deleteCurrentChat() {
  const s = _currentSession();
  if (s) deleteSession(s.id);
}

function renderHistory() {
  const list = document.getElementById("history-list");
  list.innerHTML = "";
  _sessions.forEach(s => {
    const el = document.createElement("div");
    el.className = "history-item" + (s.id === _currentId ? " active" : "");
    el.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.label)}</span>
      <button onclick="event.stopPropagation();deleteSession('${s.id}')" title="წაშლა"
        style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.82rem;padding:0 2px;line-height:1;flex-shrink:0;opacity:0.6">✕</button>`;
    el.onclick = () => switchSession(s.id);
    list.appendChild(el);
  });
}

function renderFilesList() {
  const s = _currentSession();
  const files = s ? s.files : [];
  const activeDocId = s ? s.activeDocId : null;
  const section = document.getElementById("files-section");
  const list = document.getElementById("files-list");
  if (!files.length) { section.style.display = "none"; return; }
  section.style.display = "";
  list.innerHTML = "";
  files.forEach(f => {
    const el = document.createElement("div");
    el.className = "file-item" + (f.doc_id === activeDocId ? " active" : "");
    el.innerHTML = `
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;opacity:.65"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="file-item-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
      <button class="file-del" title="წაშლა" onclick="event.stopPropagation();deleteFile('${f.doc_id}')">✕</button>`;
    el.onclick = () => toggleFileFilter(f.doc_id);
    list.appendChild(el);
  });
  updateFileChip();
}

function updateFileChip() {
  const s = _currentSession();
  const activeDocId = s ? s.activeDocId : null;
  const chip = document.getElementById("file-filter-chip");
  const label = document.getElementById("file-filter-name");
  if (activeDocId && s) {
    const f = s.files.find(x => x.doc_id === activeDocId);
    label.textContent = f ? f.name : activeDocId.slice(0, 8);
    chip.classList.add("visible");
  } else {
    chip.classList.remove("visible");
  }
}

function newChat() {
  _createSession();
  renderHistory();
  renderChat();
  renderHeader();
  renderFilesList();
  updateFileChip();
}

function switchSession(id) {
  if (_currentId === id) return;
  _currentId = id;
  _saveSessions();
  renderHistory();
  renderChat();
  renderHeader();
  renderFilesList();
  updateFileChip();
}

function toggleFileFilter(doc_id) {
  const s = _currentSession();
  if (!s) return;
  s.activeDocId = (s.activeDocId === doc_id) ? null : doc_id;
  _saveSessions();
  renderFilesList();
  updateFileChip();
}

function clearFileFilter() {
  const s = _currentSession();
  if (!s) return;
  s.activeDocId = null;
  _saveSessions();
  renderFilesList();
  updateFileChip();
}

async function deleteFile(doc_id) {
  const delBtn = document.querySelector(`.file-del[onclick*="${doc_id}"]`);
  if (delBtn) delBtn.innerHTML = '<span class="file-del-spinner"></span>';
  try {
    await fetch(`/documents/${doc_id}`, {
      method: "DELETE",
      headers: { "X-Admin-Token": _lastToken },
    });
  } catch {}
  const s = _currentSession();
  if (s) {
    s.files = s.files.filter(f => f.doc_id !== doc_id);
    if (s.activeDocId === doc_id) s.activeDocId = null;
  }
  _saveSessions();
  renderFilesList();
  updateFileChip();
}

function _appendTyping() {
  const chat = document.getElementById("chat-area");
  const row = document.createElement("div");
  row.className = "message-row"; row.id = "typing-row";
  row.innerHTML = `<div class="avatar ai-av">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/>
      <path d="M12 7v4"/>
    </svg>
  </div>
  <div class="msg-wrapper">
    <div class="bubble ai-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>
  </div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function _removeTyping() {
  const el = document.getElementById("typing-row");
  if (el) el.remove();
}

async function submitQuestion() {
  const ta = document.getElementById("question");
  const q = ta.value.trim();
  if (!q) return;
  const btn = document.getElementById("send-btn");
  if (btn.disabled) return;

  const s = _currentSession();
  if (!s) return;

  btn.disabled = true;
  ta.value = "";
  ta.style.height = "";

  const time = _nowTime();
  if (s.messages.length === 0) {
    s.label = q.length > 40 ? q.slice(0, 40) + "…" : q;
  }
  s.messages.push({ role: "user", text: q, time });
  _saveSessions();

  // Switch from empty layout to chat layout before appending messages
  document.getElementById("main").classList.remove("is-empty");

  const chat = document.getElementById("chat-area");
  const w = document.getElementById("welcome");
  if (w) w.remove();
  const uDiv = document.createElement("div");
  uDiv.innerHTML = _userRowHTML(q, time);
  chat.appendChild(uDiv.firstElementChild);
  chat.scrollTop = chat.scrollHeight;
  _appendTyping();
  renderHistory();
  renderHeader();

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 240000);

  try {
    const askBody = { question: q, session_id: s.id };
    if (s.activeDocId) askBody.doc_id = s.activeDocId;
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(askBody),
      signal: controller.signal,
    });
    const data = await res.json();
    _removeTyping();

    const aiTime = _nowTime();
    const aiData = !res.ok
      ? { answer: httpErr(res.status), _error: true, steps_used: 0 }
      : data;

    s.messages.push({ role: "ai", data: aiData, time: aiTime });
    _saveSessions();

    const aDiv = document.createElement("div");
    aDiv.innerHTML = _aiBubbleHTML(aiData, aiTime);
    chat.appendChild(aDiv.firstElementChild);
    chat.scrollTop = chat.scrollHeight;
    renderHeader();
  } catch (e) {
    _removeTyping();
    const aiTime = _nowTime();
    const aiData = { answer: e.name === "AbortError" ? t("timeoutMsg") : t("errorMsg"), _error: true, steps_used: 0 };
    s.messages.push({ role: "ai", data: aiData, time: aiTime });
    _saveSessions();
    const aDiv = document.createElement("div");
    aDiv.innerHTML = _aiBubbleHTML(aiData, aiTime);
    chat.appendChild(aDiv.firstElementChild);
    chat.scrollTop = chat.scrollHeight;
  } finally {
    clearTimeout(timer);
    btn.disabled = false;
    ta.focus();
  }
}

function openAdmin()  { document.getElementById("admin-overlay").classList.add("open"); }
function closeAdmin() { document.getElementById("admin-overlay").classList.remove("open"); }
function closeAdminIfOutside(e) { if (e.target === document.getElementById("admin-overlay")) closeAdmin(); }

function switchTab(name) {
  document.getElementById("tab-file").style.display = name === "file" ? "" : "none";
  document.getElementById("tab-text").style.display = name === "text" ? "" : "none";
  document.querySelectorAll(".admin-tab").forEach((btn, i) => {
    btn.classList.toggle("active", (i === 0) === (name === "file"));
  });
  document.getElementById("admin-msg").textContent = "";
}

let _selectedFile = null;

function onFileSelected(input) {
  _selectedFile = input.files[0] || null;
  document.getElementById("drop-filename").textContent = _selectedFile ? _selectedFile.name : "";
}

function setupDropZone() {
  const zone = document.getElementById("drop-zone");
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("dragover"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("dragover");
    const f = e.dataTransfer.files[0];
    if (f) { _selectedFile = f; document.getElementById("drop-filename").textContent = f.name; }
  });
}

async function uploadFile() {
  const token = document.getElementById("admin-token").value.trim();
  const msg   = document.getElementById("admin-msg");
  if (!token)         { msg.className="err"; msg.textContent="Token required."; return; }
  if (!_selectedFile) { msg.className="err"; msg.textContent="Please select a file."; return; }

  _lastToken = token;
  const btn = document.getElementById("file-upload-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin-icon"></span>იტვირთება...';
  msg.textContent = "";

  const s = _currentSession();
  const form = new FormData();
  form.append("file", _selectedFile);
  if (s) form.append("session_id", s.id);

  try {
    const res = await fetch("/documents/upload", {
      method: "POST",
      headers: { "X-Admin-Token": token },
      body: form,
    });
    const data = await res.json();
    if (!res.ok) {
      msg.className = "err";
      msg.textContent = httpErr(res.status);
    } else {
      if (s && !s.files.find(f => f.doc_id === data.doc_id)) {
        s.files.unshift({ doc_id: data.doc_id, name: _selectedFile.name });
        s.activeDocId = data.doc_id;
        _saveSessions();
      }
      renderFilesList();
      updateFileChip();
      _selectedFile = null;
      document.getElementById("drop-filename").textContent = "";
      document.getElementById("file-input").value = "";
      setTimeout(closeAdmin, 800);
    }
  } catch {
    msg.className = "err"; msg.textContent = t("errorMsg");
  } finally {
    btn.disabled = false; btn.textContent = t("uploadButton");
  }
}

async function uploadDocument() {
  const token  = document.getElementById("admin-token").value.trim();
  const title  = document.getElementById("doc-title").value.trim();
  const text   = document.getElementById("doc-text").value.trim();
  const source = document.getElementById("doc-source").value.trim();
  const msg    = document.getElementById("admin-msg");
  if (!token || !title || !text) { msg.className="err"; msg.textContent="Token, title and text are required."; return; }
  _lastToken = token;
  const ubtn = document.getElementById("upload-btn");
  ubtn.disabled = true;
  ubtn.innerHTML = '<span class="spin-icon"></span>იტვირთება...';

  const s = _currentSession();
  try {
    const res = await fetch("/documents", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": token },
      body: JSON.stringify({ title, text, source, format:"text", language:"en", chunking_strategy:"sentence_window", session_id: s ? s.id : null }),
    });
    const data = await res.json();
    if (!res.ok) { msg.className="err"; msg.textContent = httpErr(res.status); }
    else {
      if (s && !s.files.find(f => f.doc_id === data.doc_id)) {
        s.files.unshift({ doc_id: data.doc_id, name: title });
        s.activeDocId = data.doc_id;
        _saveSessions();
      }
      renderFilesList();
      updateFileChip();
      document.getElementById("doc-title").value = "";
      document.getElementById("doc-text").value  = "";
      document.getElementById("doc-source").value = "";
      setTimeout(closeAdmin, 800);
    }
  } catch { msg.className="err"; msg.textContent = t("errorMsg"); }
  finally { ubtn.disabled = false; ubtn.textContent = t("uploadButton"); }
}

document.addEventListener("DOMContentLoaded", () => {
  applyI18n();
  setupDropZone();
  _loadSessions();
  renderHistory();
  renderChat();
  renderHeader();
  renderFilesList();
  updateFileChip();

  const ta = document.getElementById("question");
  ta.addEventListener("input", () => {
    ta.style.height = "";
    ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
  });
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
  });
});
</script>
</body>
</html>
